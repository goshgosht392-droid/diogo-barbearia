body::before{
  content:"";
  position:fixed;
  inset:-30%;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 8%,rgba(255,255,255,.16),transparent 18%),
    radial-gradient(circle at 15% 65%,rgba(255,255,255,.055),transparent 20%),
    radial-gradient(circle at 85% 75%,rgba(255,255,255,.045),transparent 20%);
  animation:ambient 9s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.12;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.5px);
  background-size:95px 95px;
  mask-image:linear-gradient(to bottom,transparent,black 25%,black 75%,transparent);
  animation:particles 18s linear infinite;
}

.page{
  position:relative;
  z-index:2;
  width:min(100%,620px);
  min-height:100vh;
  margin:auto;
  padding:34px 20px 52px;
}

.logo-wrap{
  display:flex;
  justify-content:center;
  padding:8px 0 34px;
  animation:logoIn 1.1s cubic-bezier(.2,.8,.2,1) both;
}

.logo{
  width:min(94%,480px);
  height:auto;
  display:block;
  filter:
    drop-shadow(0 0 8px rgba(255,255,255,.16))
    drop-shadow(0 8px 24px rgba(0,0,0,.8));
  animation:logoGlow 4s ease-in-out 1.1s infinite alternate;
}

.list-title{
  display:flex;
  align-items:center;
  gap:14px;
  margin:0 3px 14px;
  opacity:0;
  animation:fadeUp .7s ease-out .45s forwards;
}
.list-title::before,.list-title::after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45));
}
.list-title::after{
  background:linear-gradient(90deg,rgba(255,255,255,.45),transparent);
}
.list-title span{
  font-size:10px;
  font-weight:600;
  letter-spacing:4px;
  color:rgba(255,255,255,.65);
  text-transform:uppercase;
}

.price-list{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.17);
  border-radius:20px;
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(0,0,0,.48));
  backdrop-filter:blur(13px);
  -webkit-backdrop-filter:blur(13px);
  box-shadow:
    0 24px 70px rgba(0,0,0,.6),
    inset 0 1px rgba(255,255,255,.1);
}

.price-list::before{
  content:"";
  position:absolute;
  top:0;
  left:-35%;
  width:35%;
  height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.09),transparent);
  transform:skewX(-18deg);
  animation:shine 6s ease-in-out 2s infinite;
  pointer-events:none;
}

.price{
  position:relative;
  min-height:70px;
  padding:0 21px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  border-bottom:1px solid rgba(255,255,255,.105);
  opacity:0;
  transform:translateY(14px);
  animation:rowIn .65s cubic-bezier(.2,.75,.2,1) forwards;
  transition:background .25s ease, padding .25s ease;
}

.price:last-child{border-bottom:0}

.price:nth-child(1){animation-delay:.55s}
.price:nth-child(2){animation-delay:.65s}
.price:nth-child(3){animation-delay:.75s}
.price:nth-child(4){animation-delay:.85s}
.price:nth-child(5){animation-delay:.95s}
.price:nth-child(6){animation-delay:1.05s}
.price:nth-child(7){animation-delay:1.15s}

.price:hover{
  background:rgba(255,255,255,.065);
  padding-left:25px;
  padding-right:25px;
}

.name{
  font-family:Oswald,Arial,sans-serif;
  font-size:20px;
  font-weight:500;
  letter-spacing:1.5px;
  text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}

.value{
  font-family:Montserrat,Arial,sans-serif;
  font-size:18px;
  font-weight:600;
  white-space:nowrap;
  letter-spacing:.2px;
  text-shadow:0 2px 10px rgba(0,0,0,.65);
}

@keyframes logoIn{
  from{opacity:0;transform:translateY(-22px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes logoGlow{
  from{filter:drop-shadow(0 0 5px rgba(255,255,255,.12)) drop-shadow(0 8px 24px rgba(0,0,0,.8))}
  to{filter:drop-shadow(0 0 18px rgba(255,255,255,.28)) drop-shadow(0 8px 24px rgba(0,0,0,.8))}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes rowIn{
  to{opacity:1;transform:translateY(0)}
}
@keyframes ambient{
  from{transform:scale(1);opacity:.65}
  to{transform:scale(1.08);opacity:1}
}
@keyframes particles{
  from{transform:translateY(0)}
  to{transform:translateY(-95px)}
}
@keyframes shine{
  0%,35%{left:-35%}
  55%,100%{left:130%}
}

@media(max-width:430px){
  .page{padding:27px 14px 40px}
  .logo-wrap{padding-top:5px;padding-bottom:27px}
  .logo{width:96%}
  .list-title{margin-bottom:11px}
  .price{min-height:64px;padding:0 16px}
  .name{font-size:17px;letter-spacing:1px}
  .value{font-size:16px}
  .price:hover{padding-left:19px;padding-right:19px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
